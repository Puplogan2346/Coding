# Streamlit Cloud reads config from the repo root (its working directory), not
# from ai_code_tutor_app/.streamlit/. This mirrors the app's theme so the
# deployed app picks it up; the nested copy covers local runs from the app dir.
[browser]
gatherUsageStats = false

# Warm sunset theme: cream canvas, warm-white surfaces, espresso text, and a
# friendly orange accent. Pairs with the CSS in app.py apply_theme().
[theme]
base = "light"
primaryColor = "#F97316"
backgroundColor = "#FAF5EF"
secondaryBackgroundColor = "#FFFDF9"
textColor = "#2D2A26"
