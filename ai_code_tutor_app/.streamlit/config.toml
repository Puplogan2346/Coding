[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# Apple-inspired light theme: iOS system blue accent, Apple gray canvas,
# white surfaces, near-black text. Pairs with the CSS in app.py apply_theme().
[theme]
base = "light"
primaryColor = "#0071E3"
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1D1D1F"
