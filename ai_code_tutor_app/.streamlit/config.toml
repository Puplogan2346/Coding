[server]
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# Warm sunset theme: cream canvas, warm-white surfaces, espresso text, and a
# friendly orange accent. Pairs with the CSS in app.py apply_theme().
# Mirrored at the repo root for Streamlit Cloud (which runs from the repo root).
[theme]
base = "light"
primaryColor = "#F97316"
backgroundColor = "#FAF5EF"
secondaryBackgroundColor = "#FFFDF9"
textColor = "#2D2A26"
