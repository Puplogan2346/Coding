[project]
name = "ai-code-tutor"
version = "0.17.0"
description = "A daily coding gym for learning Python, prompting, and AI-assisted coding."
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.57.0",
    "openai>=2.38.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
