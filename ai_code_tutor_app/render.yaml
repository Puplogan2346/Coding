services:
  - type: web
    name: ai-code-tutor
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address=0.0.0.0 --server.port=$PORT
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: ALLOW_CODE_RUNNER
        value: false
      - key: APP_DATA_DIR
        value: data
      - key: OPENAI_API_KEY
        sync: false
